#this yml file is used to define the workflow for the backend continuous integration (CI) process.
#It specifies the conditions under which the workflow should be triggered, the jobs to be executed, and the steps within each job.
name: backend-ci

on: 
  push:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"] 
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: takaflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env: 
      DATABASE_URL: postgresql+psycopg://postgres:ci-test-password@localhost:5432/takaflow_test
      JWT_SECRET_KEY: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - run: python -m alembic upgrade head

      - run: python -m pytest
