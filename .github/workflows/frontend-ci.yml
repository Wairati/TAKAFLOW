name: frontend-ci

on:
  push:
    paths: ["apps/**", "packages/**", "package.json", ".github/workflows/frontend-ci.yml"]
  pull_request:
    paths: ["apps/**", "packages/**", "package.json", ".github/workflows/frontend-ci.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci
      - run: npm run build
